
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRIMSON</title>

<style>
:root {
  --red: #ff174f;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 35%, #26000d 0%, #100008 40%, #030303 85%);
  color: white;
  font-family: Arial, sans-serif;
  padding: 35px 12px;
  overflow-x: hidden;
  position: relative;
}

/* MOVING NEON SNAKE */

.snake {
  position: fixed;
  inset: 7px;
  width: calc(100% - 14px);
  height: calc(100% - 14px);
  pointer-events: none;
  z-index: 0;
  overflow: visible;
}

.snake path {
  fill: none;
  stroke: var(--red);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-dasharray: 55 1800;
  animation: snakeMove 9s linear infinite;
  filter:
    drop-shadow(0 0 4px #ff174f)
    drop-shadow(0 0 9px #ff174f)
    drop-shadow(0 0 16px #ff174f88);
}

@keyframes snakeMove {
  from {
    stroke-dashoffset: 0;
  }
  to {
    stroke-dashoffset: -1855;
  }
}

/* CONTENT */

.content {
  position: relative;
  z-index: 1;
}

/* TITLE */

header {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  color: var(--red);
  font-size: clamp(40px, 10vw, 66px);
  font-weight: 900;
  letter-spacing: 7px;
  animation: glow 1.5s infinite alternate;
}

@keyframes glow {
  from {
    text-shadow: 0 0 5px var(--red), 0 0 10px var(--red);
  }
  to {
    text-shadow: 0 0 12px var(--red), 0 0 22px #ff174f88;
  }
}

/* SEARCH */

.search {
  width: 100%;
  max-width: 600px;
  height: 52px;
  margin: 0 auto;
  border: 2px solid var(--red);
  border-radius: 30px;
  box-shadow: 0 0 5px var(--red), 0 0 12px #ff174f66;
  display: flex;
  align-items: center;
  padding: 0 16px;
  background: #101010;
  gap: 12px;
}

.back {
  border: 1px solid var(--red);
  background: #151515;
  color: white;
  border-radius: 20px;
  padding: 6px 12px;
  box-shadow: 0 0 5px #ff174f77;
  cursor: pointer;
}

.search-text {
  color: #999;
  font-size: 13px;
}

/* APPS */

.tiles {
  display: flex;
  justify-content: center;
  gap: 10px;
  width: 100%;
  max-width: 600px;
  margin: 28px auto 0;
}

.tile {
  flex: 1;
  min-width: 0;
  height: 46px;
  background: #101010;
  border: 2px solid var(--red);
  border-radius: 9px;
  color: white;
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: center;
  gap: 7px;
  box-shadow: 0 0 5px var(--red), 0 0 12px #ff174f66;
  cursor: pointer;
}

.tile:active {
  transform: scale(.97);
}

.symbol {
  color: var(--red);
  font-size: 21px;
  font-weight: bold;
  text-shadow: 0 0 7px #ff174f88;
}

.tile span:last-child {
  font-size: 11px;
  letter-spacing: .5px;
}

</style>
</head>

<body>

<!-- SNAKE ANIMATION -->
<svg class="snake" viewBox="0 0 400 800" preserveAspectRatio="none">
  <path d="M 35 15
           H 365
           Q 385 15 385 35
           V 765
           Q 385 785 365 785
           H 35
           Q 15 785 15 765
           V 35
           Q 15 15 35 15" />
</svg>

<div class="content">

<header>
  <div class="logo">CRIMSON</div>
</header>

<div class="search">
  <button class="back" onclick="history.back()">←</button>
  <span class="search-text">Search the web...</span>
</div>

<div class="tiles">

  <button class="tile" onclick="window.open('https://www.youtube.com','_blank')">
    <div class="symbol">▶</div>
    <span>YOUTUBE</span>
  </button>

  <button class="tile" onclick="window.open('https://www.tiktok.com','_blank')">
    <div class="symbol">♪</div>
    <span>TIKTOK</span>
  </button>

  <button class="tile" onclick="window.open('https://geometrydash.com/game/index.html','_blank')">
    <div class="symbol">✦</div>
    <span>GAMES</span>
  </button>

</div>

</div>

</body>
</html>
