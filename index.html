
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRIMSON</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(ellipse at 50% 35%, #791b2b 0%, transparent 55%),
    linear-gradient(145deg, #180308, #390611 55%, #100205);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
}

.container {
  width: 90%;
  max-width: 650px;
  text-align: center;
}

.logo {
  font-size: clamp(42px, 10vw, 68px);
  font-weight: 900;
  letter-spacing: 9px;
  margin-bottom: 35px;
  text-shadow: 0 0 30px #ff304f66;
}

.logo span {
  color: #ff405c;
}

.search {
  display: flex;
  width: 100%;
  background: #ffffff12;
  border: 1px solid #ffffff30;
  border-radius: 50px;
  padding: 7px;
  backdrop-filter: blur(12px);
  margin-bottom: 42px;
}

.search input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  padding: 12px 17px;
  font-size: 16px;
}

.search input::placeholder {
  color: #d5b9bf;
}

.search button {
  border: none;
  border-radius: 50px;
  background: #e52c49;
  color: white;
  padding: 0 20px;
  font-weight: bold;
}

.shortcuts {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}

.shortcut {
  width: 105px;
  min-height: 88px;
  padding: 15px 8px;
  border-radius: 18px;
  background: #ffffff10;
  border: 1px solid #ffffff20;
  color: white;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  transition: 0.2s;
}

.shortcut:hover {
  background: #ffffff25;
  transform: translateY(-4px);
}

.shortcut svg {
  width: 27px;
  height: 27px;
}

.shortcut span {
  font-size: 13px;
  font-weight: bold;
}

footer {
  margin-top: 55px;
  color: #c99ba5;
  font-size: 12px;
  letter-spacing: 3px;
}

@media (max-width: 420px) {
  .shortcuts {
    gap: 9px;
  }
  .shortcut {
    width: 90px;
  }
}
</style>
</head>

<body>
<main class="container">

  <div class="logo">CRIM<span>SON</span></div>

  <form class="search" action="https://www.google.com/search" method="GET">
    <input type="search" name="q" placeholder="Search the web..." required>
    <button type="submit">Search</button>
  </form>

  <section class="shortcuts">

    <a class="shortcut" href="https://www.youtube.com">
      <svg viewBox="0 0 24 24" fill="#ff3333">
        <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z"/>
      </svg>
      <span>YouTube</span>
    </a>

    <a class="shortcut" href="https://www.tiktok.com">
      <svg viewBox="0 0 24 24" fill="white">
        <path d="M19.6 7.1a6.5 6.5 0 0 1-4.2-4.2V2h-4v13.8a2.8 2.8 0 1 1-2.8-2.8c.4 0 .8.1 1.1.2V9.1a7 7 0 1 0 5.7 6.9V9a10.5 10.5 0 0 0 4.2 1z"/>
      </svg>
      <span>TikTok</span>
    </a>

    <a class="shortcut" href="https://www.crazygames.com">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ff536c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9h12a4 4 0 0 1 3.8 5.2l-1 3A2.5 2.5 0 0 1 17 18l-2-2H9l-2 2a2.5 2.5 0 0 1-3.8-.8l-1-3A4 4 0 0 1 6 9z"/>
        <path d="M8 12v4M6 14h4M16 13h.01M18 15h.01"/>
      </svg>
      <span>Games</span>
    </a>

    <a class="shortcut" href="https://www.google.com">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2.1H12v4h5.4a4.6 4.6 0 0 1-2 3v2.5h3.3c1.9-1.8 2.9-4.3 2.9-7.4z"/>
        <path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.4l-3.3-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3v2.6A10 10 0 0 0 12 22z"/>
        <path fill="#FBBC05" d="M6.4 14a6 6 0 0 1 0-4V7.4H3a10 10 0 0 0 0 9.2z"/>
        <path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.9 1.5l2.9-2.9A9.7 9.7 0 0 0 12 2a10 10 0 0 0-9 5.4l3.4 2.6c.8-2.3 3-4.1 5.6-4.1z"/>
      </svg>
      <span>Google</span>
    </a>

  </section>

  <footer>YOUR WORLD. YOUR STARTING POINT.</footer>

</main>
</body>
</html>
