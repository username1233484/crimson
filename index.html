
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRIMSON</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 40%, #26000b 0%, #100006 38%, #030303 78%);
  color: white;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

.snake {
  position: fixed;
  inset: 8px;
  border: 2px solid transparent;
  border-radius: 18px;
  pointer-events: none;
  z-index: 0;
  animation: snakeGlow 5s linear infinite;
}

.snake::before {
  content: "";
  position: absolute;
  inset: -2px;
  border: 2px solid transparent;
  border-top-color: #ff1744;
  border-radius: 18px;
  filter: drop-shadow(0 0 7px #ff1744);
  animation: snakeMove 7s linear infinite;
}

@keyframes snakeMove {
  to { transform: rotate(360deg); }
}

@keyframes snakeGlow {
  50% { filter: drop-shadow(0 0 9px #8b001e); }
}

#home {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  padding: 70px 20px 30px;
  display: flex;
  align-items: center;
  flex-direction: column;
}

.logo {
  font-size: clamp(42px, 12vw, 70px);
  font-weight: 900;
  letter-spacing: 8px;
  color: #ff244f;
  text-shadow: 0 0 8px #ff1744, 0 0 25px #a00028;
  animation: logoPulse 3s ease-in-out infinite;
  margin-bottom: 35px;
}

@keyframes logoPulse {
  50% {
    text-shadow: 0 0 14px #ff1744, 0 0 35px #c00035;
  }
}

.search {
  width: min(100%, 440px);
  display: flex;
  border: 1px solid #ff1744;
  border-radius: 9px;
  background: #090909;
  box-shadow: 0 0 12px #5b0018;
  overflow: hidden;
}

.search input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  outline: none;
  padding: 13px;
  color: white;
}

.search button {
  background: #a5002a;
  color: white;
  border: 0;
  padding: 0 16px;
}

.apps {
  width: min(100%, 440px);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 18px;
}

.app-btn {
  background: #090909;
  color: #ff3159;
  border: 1px solid #c00035;
  border-radius: 8px;
  padding: 14px 4px;
  box-shadow: 0 0 8px #470014;
  transition: .2s;
  font-weight: bold;
}

.app-btn:hover {
  background: #28000c;
  box-shadow: 0 0 15px #ff1744;
  transform: translateY(-2px);
}

.page {
  display: none;
  min-height: 100vh;
  position: relative;
  z-index: 1;
  padding: 25px 16px;
}

.page.active {
  display: block;
}

.page-title {
  color: #ff3159;
  text-shadow: 0 0 10px #ff1744;
  text-align: center;
  font-size: 30px;
}

.back-btn {
  border: 1px solid #ff1744;
  background: #100007;
  color: #ff4267;
  padding: 10px 15px;
  border-radius: 8px;
}

.game-card {
  border: 1px solid #ff1744;
  border-radius: 12px;
  background: #090909;
  padding: 18px;
  margin: 15px auto;
  max-width: 420px;
  box-shadow: 0 0 12px #59001b;
}

.game-card button {
  width: 100%;
  background: #a5002a;
  border: 0;
  color: white;
  border-radius: 7px;
  padding: 12px;
  margin-top: 10px;
}

/* FULL GAME WINDOW */

.game-wrap {
  display: none;
  position: fixed;
  inset: 12px;
  z-index: 100;
  background: #050505;
  border: 2px solid #ff1744;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 22px #ff1744;
}

.game-wrap.expanded {
  display: block;
}

.game-wrap iframe {
  width: 100%;
  height: 100%;
  border: 0;
  background: black;
}

.exit-overlay {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 200;
  background: #a5002a;
  color: white;
  border: 1px solid #ff4267;
  border-radius: 7px;
  padding: 10px 15px;
}

/* YOUTUBE WINDOW */

#youtubeOverlay {
  display: none;
  position: fixed;
  inset: 12px;
  z-index: 300;
  background: #070707;
  border: 2px solid #ff1744;
  border-radius: 13px;
  box-shadow: 0 0 22px #ff1744;
  overflow: hidden;
  flex-direction: column;
}

#youtubeOverlay.open {
  display: flex;
}

.yt-top {
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 13px;
  border-bottom: 1px solid #8e0027;
  background: #100006;
}

.yt-brand {
  font-size: 19px;
  font-weight: bold;
  color: #ff3159;
}

.guest {
  color: #aaa;
  font-size: 11px;
  margin-left: auto;
}

.yt-close {
  background: #a5002a;
  border: 0;
  border-radius: 6px;
  padding: 8px 13px;
  color: white;
}

.yt-content {
  padding: 14px;
  overflow-y: auto;
  flex: 1;
}

.yt-search {
  display: flex;
  gap: 8px;
  margin-bottom: 13px;
}

.yt-search input {
  min-width: 0;
  flex: 1;
  padding: 12px;
  background: #151515;
  border: 1px solid #a5002a;
  border-radius: 8px;
  color: white;
  outline: none;
}

.yt-search button {
  background: #c00035;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 0 13px;
  font-weight: bold;
}

.yt-note {
  color: #999;
  font-size: 12px;
  margin-bottom: 14px;
}

#ytResults {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 13px;
}

.yt-result {
  background: #141414;
  border: 1px solid #551024;
  border-radius: 9px;
  padding: 8px;
  cursor: pointer;
  transition: .2s;
}

.yt-result:hover {
  border-color: #ff1744;
  box-shadow: 0 0 10px #65001e;
}

.yt-result img {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  border-radius: 6px;
}

.yt-result p {
  font-size: 13px;
  line-height: 1.4;
  color: white;
  margin: 8px 2px;
}

#ytPlayer {
  margin-top: 15px;
}

#ytPlayer iframe {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 1px solid #ff1744;
  border-radius: 9px;
}

.status {
  color: #ff4267;
  text-align: center;
  padding: 18px;
  grid-column: 1 / -1;
}

@media (max-width: 450px) {
  #ytResults {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="snake"></div>

<!-- HOME -->

<main id="home">
  <div class="logo">CRIMSON</div>

  <form class="search" onsubmit="searchWeb(event)">
    <input id="webSearch" placeholder="Search with DuckDuckGo...">
    <button type="submit">GO</button>
  </form>

  <div class="apps">
    <button class="app-btn" onclick="openYoutube()">YOUTUBE</button>
    <button class="app-btn" onclick="openTikTok()">TIKTOK</button>
    <button class="app-btn" onclick="showPage('games')">GAMES</button>
  </div>
</main>

<!-- GAMES PAGE -->

<section id="games" class="page">
  <button class="back-btn" onclick="goHome()">← HOME</button>
  <h1 class="page-title">GAMES</h1>

  <div class="game-card">
    <h2>Geometry Dash</h2>
    <p>Play Geometry Dash inside CRIMSON.</p>
    <button onclick="openGame()">PLAY GAME</button>
  </div>
</section>

<!-- GAME WINDOW -->

<div id="gameWrap" class="game-wrap">
  <button class="exit-overlay" onclick="exitGame()">EXIT ✕</button>
  <iframe id="gameFrame"
    src="about:blank"
    allow="fullscreen; autoplay"
    allowfullscreen>
  </iframe>
</div>

<!-- YOUTUBE WINDOW -->

<div id="youtubeOverlay">
  <header class="yt-top">
    <div class="yt-brand">▶ CRIMSON TUBE</div>
    <div class="guest">GUEST MODE</div>
    <button class="yt-close" onclick="closeYoutube()">✕</button>
  </header>

  <div class="yt-content">
    <form class="yt-search" onsubmit="searchYouTube(event)">
      <input id="ytSearch" placeholder="Search YouTube...">
      <button type="submit">SEARCH</button>
    </form>

    <div class="yt-note">
      Search YouTube videos without leaving CRIMSON.
    </div>

    <div id="ytResults">
      <div class="status">Search for something to get started.</div>
    </div>

    <div id="ytPlayer"></div>
  </div>
</div>

<script>

/* ADD YOUR YOUTUBE API KEY HERE */

const YOUTUBE_API_KEY = "PASTE_YOUR_API_KEY_HERE";

/* HOME SEARCH */

function searchWeb(event) {
  event.preventDefault();
  const query = document.getElementById("webSearch").value.trim();
  if (!query) return;

  window.open(
    "https://duckduckgo.com/?q=" + encodeURIComponent(query),
    "_blank"
  );
}

/* PAGE NAVIGATION */

function showPage(page) {
  document.getElementById("home").style.display = "none";

  document.querySelectorAll(".page").forEach(p => {
    p.classList.remove("active");
  });

  document.getElementById(page).classList.add("active");
  exitGame();
  closeYoutube();
}

function goHome() {
  document.querySelectorAll(".page").forEach(p => {
    p.classList.remove("active");
  });

  document.getElementById("home").style.display = "flex";
  exitGame();
}

/* TIKTOK */

function openTikTok() {
  window.open("https://www.tiktok.com/", "_blank");
}

/* GAME WINDOW */

function openGame() {
  const wrap = document.getElementById("gameWrap");
  document.getElementById("gameFrame").src =
    "https://geometrydash.com/game/index.html";

  wrap.classList.add("expanded");
}

function exitGame() {
  const wrap = document.getElementById("gameWrap");
  wrap.classList.remove("expanded");
  document.getElementById("gameFrame").src = "about:blank";
}

/* YOUTUBE WINDOW */

function openYoutube() {
  document.getElementById("youtubeOverlay").classList.add("open");
}

function closeYoutube() {
  document.getElementById("youtubeOverlay").classList.remove("open");
  document.getElementById("ytPlayer").replaceChildren();
}

/* REAL YOUTUBE SEARCH */

async function searchYouTube(event) {
  event.preventDefault();

  const query = document.getElementById("ytSearch").value.trim();
  const results = document.getElementById("ytResults");
  const player = document.getElementById("ytPlayer");

  if (!query) return;

  if (
    !YOUTUBE_API_KEY ||
    YOUTUBE_API_KEY === "PASTE_YOUR_API_KEY_HERE"
  ) {
    results.innerHTML =
      '<div class="status">Add your YouTube API key in the code first.</div>';
    return;
  }

  results.innerHTML =
    '<div class="status">Searching YouTube...</div>';

  player.replaceChildren();

  try {
    const url =
      "https://www.googleapis.com/youtube/v3/search" +
      "?part=snippet&type=video&maxResults=12" +
      "&q=" + encodeURIComponent(query) +
      "&key=" + encodeURIComponent(YOUTUBE_API_KEY);

    const response = await fetch(url);
    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error?.message || "YouTube search failed."
      );
    }

    results.replaceChildren();

    if (!data.items || data.items.length === 0) {
      results.innerHTML =
        '<div class="status">No videos found.</div>';
      return;
    }

    data.items.forEach(video => {
      const id = video.id.videoId;
      const title = video.snippet.title;
      const thumbnail =
        video.snippet.thumbnails.medium.url;

      const card = document.createElement("div");
      card.className = "yt-result";

      const img = document.createElement("img");
      img.src = thumbnail;
      img.alt = "";

      const text = document.createElement("p");
      text.textContent = title;

      card.append(img, text);

      card.addEventListener("click", () => {
        player.replaceChildren();

        const iframe = document.createElement("iframe");

        iframe.src =
          "https://www.youtube-nocookie.com/embed/" +
          encodeURIComponent(id);

        iframe.title = title;
        iframe.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.allowFullscreen = true;

        player.appendChild(iframe);
        player.scrollIntoView({ behavior: "smooth" });
      });

      results.appendChild(card);
    });

  } catch (error) {
    results.innerHTML = "";

    const message = document.createElement("div");
    message.className = "status";
    message.textContent = "Search error: " + error.message;

    results.appendChild(message);
  }
}

</script>
</body>
</html>
